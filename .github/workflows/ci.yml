name: CI

on:
  # Every branch push gets the full pipeline (not just main), so problems
  # show up before a PR is even opened.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Unit tests + end-to-end tests (tests/e2e.rs runs the real binary
      # against local TCP / UDP / TLS servers).
      - run: cargo test --locked --all-targets
      # (binary-only crate: no library, so no doctests to run)

  syn:
    name: SYN scan (Linux raw sockets + libpcap)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libpcap0.8t64
      - run: cargo test --locked --test syn --no-run
      # Give only the binary under test CAP_NET_RAW; cargo itself stays unprivileged.
      - run: sudo setcap cap_net_raw+ep target/debug/rustscan-rs
      - name: IPv4 + IPv6 over raw sockets
        run: cargo test --locked --test syn -- --ignored
      # The macOS / Windows code path (frame injection), exercised on Linux.
      # Linux drops frames injected on `lo` from 127.0.0.1 as martians unless
      # these are set (real interfaces don't need them).
      - name: IPv4 + IPv6 over libpcap
        run: |
          sudo sysctl -w net.ipv4.conf.all.route_localnet=1 net.ipv4.conf.lo.route_localnet=1             net.ipv4.conf.all.accept_local=1 net.ipv4.conf.lo.accept_local=1
          cargo test --locked --test syn -- --ignored
        env:
          RUSTSCAN_SYN_BACKEND: pcap

  syn-macos:
    name: SYN scan (macOS, libpcap)
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --test syn --no-run
      # /dev/bpf* needs root. (Windows has no CI job: the free Npcap
      # installer can't run unattended; that path is tested by hand.)
      - run: sudo -E "$(command -v cargo)" test --locked --test syn -- --ignored

  msrv:
    name: MSRV (1.88)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on any RustSec advisory against a locked dependency.
      - run: cargo audit --deny warnings

  docker:
    name: docker build + smoke test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rustscan-rs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm rustscan-rs:ci --version
          # Scan the container's own loopback; must exit 0 and print a report.
          docker run --rm rustscan-rs:ci 127.0.0.1 -p 1-100 --timeout 300 -q | tee out.txt
          grep -q "Scan Results" out.txt
          # SYN scan as the image's non-root user (file capability CAP_NET_RAW).
          docker run --rm rustscan-rs:ci 127.0.0.1 -p - --syn -q | tee syn.txt
          grep -q "Ports scanned : 65535" syn.txt

  # Single required check for branch protection.
  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, test, syn, syn-macos, msrv, audit, docker]
    runs-on: ubuntu-latest
    steps:
      - run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          ! echo "$results" | grep -qE '"(failure|cancelled|skipped)"'
