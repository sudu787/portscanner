[package]
name = "rustscan-rs"
version = "0.1.0"
edition = "2021"
authors = ["rustscan-rs contributors"]
description = "A high-performance, async port scanner written in Rust"
license = "MIT"
repository = "https://github.com/your-org/rustscan-rs"
keywords = ["network", "security", "scanner", "port", "async"]
categories = ["command-line-utilities", "network-programming"]
readme = "README.md"

[[bin]]
name = "rustscan-rs"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Async utilities — FuturesUnordered, StreamExt
futures = "0.3"

# Network range / CIDR parsing (192.168.1.0/24 → Vec<IpAddr>)
ipnetwork = "0.20"

# TLS Handshake probing
tokio-rustls = "0.26"
rustls-pki-types = "1.0"
rustls = { version = "0.23", features = ["ring"] }

# CLI argument parsing
clap = { version = "4", features = ["derive", "color", "suggestions"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dns-lookup = "3.0.1"
x509-parser = "0.18.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
